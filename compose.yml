services:
  caddy:
    image: caddy:2.8.4
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
      - SUBDOMAIN=${SUBDOMAIN}
      - SSL_EMAIL=${SSL_EMAIL}
      - BASIC_AUTH_USER=${BASIC_AUTH_USER:-}
      - BASIC_AUTH_PASSWORD_HASH=${BASIC_AUTH_PASSWORD_HASH:-}
    volumes:
      - ./caddy_config/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app-network
    depends_on:
      - openclaw
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 256M

  openclaw:
    image: ghcr.io/openclaw/openclaw:latest
    restart: unless-stopped
    expose:
      - "18789"
    volumes:
      - openclaw_data:/home/openclaw/.openclaw
      - ./workspace:/home/openclaw/workspace
      - ${GCP_CREDENTIALS_PATH:-./credentials/adc.json}:/tmp/keys/adc.json:ro
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/tmp/keys/adc.json
      - GOOGLE_CLOUD_PROJECT=${GCP_PROJECT_ID}
      - OPENCLAW_MODEL_PROVIDER=google-vertex
      - OPENCLAW_MODEL=gemini-flash
      - VERTEX_AI_LOCATION=${VERTEX_AI_LOCATION:-asia-northeast1}
      - NODE_OPTIONS=--max-old-space-size=2048
      - TZ=Asia/Tokyo
    networks:
      - app-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 2560M
        reservations:
          memory: 1024M

  watchtower:
    image: containrrr/watchtower:1.7.1
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=86400
      - WATCHTOWER_INCLUDE_STOPPED=false
      - TZ=Asia/Tokyo
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 128M

networks:
  app-network:
    driver: bridge

volumes:
  caddy_data:
    external: true
  caddy_config:
  openclaw_data:
    external: true
    healthcheck:
      # The OpenClaw image defaults to gateway.bind=lan in containers, so
      # probing 127.0.0.1 can fail even when the gateway is healthy.
      test:
        - CMD-SHELL
        - >-
          node -e "const os=require('os');
          const ip=Object.values(os.networkInterfaces()).flat().find((x)=>x&&x.family==='IPv4'&&!x.internal)?.address||'127.0.0.1';
          fetch(`http://${ip}:18789/healthz`).then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 3m
      timeout: 10s
      start_period: 15s
      retries: 3

services:
  caddy:
    image: caddy:2.8.4
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
      - SUBDOMAIN=${SUBDOMAIN}
      - SSL_EMAIL=${SSL_EMAIL}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
      - ALLOWED_IPS=${ALLOWED_IPS:-}
      - BASIC_AUTH_USER=${BASIC_AUTH_USER:-}
      - BASIC_AUTH_PASSWORD_HASH=${BASIC_AUTH_PASSWORD_HASH:-}
    volumes:
      - ./caddy_config/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app-network
    depends_on:
      - openfang
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 256M

  ollama:
    image: ollama/ollama:latest
    profiles:
      - ollama
    restart: unless-stopped
    network_mode: "service:openfang"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    volumes:
      - ollama_data:/root/.ollama
    depends_on:
      - openfang
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 1m
      timeout: 10s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1536M

  openfang:
    build:
      context: ./openfang_config
      dockerfile: Dockerfile
      args:
        OPENFANG_SHA256_AMD64: ${OPENFANG_SHA256_AMD64}
        OPENFANG_SHA256_ARM64: ${OPENFANG_SHA256_ARM64}
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - openfang_data:/data
      - ./openfang_config/config.toml:/data/config.toml:ro
      - ${GCP_CREDENTIALS_PATH:-./credentials/adc.json}:/run/secrets/gcp-sa.json:ro
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/gcp-sa.json
      - GOOGLE_CLOUD_PROJECT=${GCP_PROJECT_ID}
      - GOOGLE_CLOUD_REGION=${VERTEX_AI_LOCATION:-global}
      - TZ=Asia/Tokyo
    networks:
      - app-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:50051/api/status 2>/dev/null || wget -qO- http://localhost:50051/ > /dev/null 2>&1 || exit 1"]
      interval: 1m
      timeout: 10s
      start_period: 30s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  watchtower:
    image: containrrr/watchtower:1.7.1
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=86400
      - WATCHTOWER_INCLUDE_STOPPED=false
      - TZ=Asia/Tokyo
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 128M

networks:
  app-network:
    driver: bridge

volumes:
  caddy_data:
    external: true
    name: ${CADDY_DATA_VOLUME:-caddy_data}
  caddy_config:
    name: ${CADDY_CONFIG_VOLUME:-caddy_config}
  openfang_data:
    name: ${OPENFANG_DATA_VOLUME:-openfang_data}
  ollama_data:
    name: ${OLLAMA_DATA_VOLUME:-ollama_data}
